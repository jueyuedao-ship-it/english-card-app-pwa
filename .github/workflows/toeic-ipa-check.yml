name: TOEIC vocabulary check

on:
  push:
    branches:
      - main
      - feature/toeic-list-ipa
  pull_request:
    paths:
      - 'toeic-*.js'
      - 'index.html'
      - 'styles.css'
      - 'sw.js'
      - 'tests/**'
      - 'scripts/**'
      - 'data/toeic/**'
      - '.github/workflows/toeic-ipa-check.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all vocabulary and pronunciation tests
        run: node --test tests/*.test.mjs
      - name: Verify all eight meaning assets are reproducible
        run: node scripts/generate-toeic-meanings.mjs --check
